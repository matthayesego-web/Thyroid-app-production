name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to sign
        required: true
        default: develop/v0.3.1

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read app version
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME" || (echo "Unable to read versionName" && exit 1)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Restore protected signing key
        env:
          SIGNING_FILE_B64: ${{ secrets.THYROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_FILE_B64" || (echo "Missing THYROID_KEYSTORE_BASE64" && exit 1)
          echo "$SIGNING_FILE_B64" | base64 --decode > "$RUNNER_TEMP/thyroid-echo-app-signing.jks"

      - name: Build unsigned APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Sign APK and AAB
        env:
          STORE_SECRET: ${{ secrets.THYROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THYROID_KEY_ALIAS }}
          KEY_SECRET: ${{ secrets.THYROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_SECRET" || (echo "Missing keystore password" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing signing alias" && exit 1)
          test -n "$KEY_SECRET" || (echo "Missing key password" && exit 1)

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          UNSIGNED_AAB="app/build/outputs/bundle/release/app-release.aab"
          ALIGNED_APK="$RUNNER_TEMP/ThyroidEcho-aligned.apk"
          SIGNED_APK="ThyroidEcho-v${VERSION_NAME}-release.apk"
          SIGNED_AAB="ThyroidEcho-v${VERSION_NAME}-release.aab"

          zipalign -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          apksigner sign \
            --ks "$RUNNER_TEMP/thyroid-echo-app-signing.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_SECRET \
            --key-pass env:KEY_SECRET \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          apksigner verify --verbose --print-certs "$SIGNED_APK"

          cp "$UNSIGNED_AAB" "$SIGNED_AAB"
          jarsigner \
            -keystore "$RUNNER_TEMP/thyroid-echo-app-signing.jks" \
            -storepass "$STORE_SECRET" \
            -keypass "$KEY_SECRET" \
            -signedjar "$SIGNED_AAB.signed" \
            "$SIGNED_AAB" \
            "$KEY_ALIAS"
          mv "$SIGNED_AAB.signed" "$SIGNED_AAB"
          jarsigner -verify -verbose -certs "$SIGNED_AAB"

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: ThyroidEcho-v${{ env.VERSION_NAME }}-signed-release
          path: |
            ThyroidEcho-v${{ env.VERSION_NAME }}-release.apk
            ThyroidEcho-v${{ env.VERSION_NAME }}-release.aab
          if-no-files-found: error
          retention-days: 30
